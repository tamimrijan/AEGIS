<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS logo concepts</title>
<style>
  body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; background: #121318; color: #E3E1E9; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
  figure { margin: 0; text-align: center; }
  img { width: 100%; max-width: 150px; border-radius: 22%; }
  figcaption { margin-top: 8px; font-size: 13px; }
  .light { background: #FAF8FF; color: #1A1B21; margin: 24px -24px -24px; padding: 24px; }
  .small img { max-width: 48px; }
</style>
</head>
<body>
<h1>AEGIS logo concepts</h1>
<div class="grid">
  <figure><img src="logo-1-apex.svg" alt="Apex"><figcaption>1 Apex</figcaption></figure>
  <figure><img src="logo-2-aspis.svg" alt="Aspis"><figcaption>2 Aspis</figcaption></figure>
  <figure><img src="logo-3-facet.svg" alt="Facet"><figcaption>3 Facet</figcaption></figure>
  <figure><img src="logo-4-hexvault.svg" alt="Hex Vault"><figcaption>4 Hex Vault</figcaption></figure>
  <figure><img src="logo-5-bloom.svg" alt="Bloom"><figcaption>5 Bloom</figcaption></figure>
</div>
<div class="light">
  <div class="grid small">
    <figure><img src="logo-1-apex.svg" alt=""></figure>
    <figure><img src="logo-2-aspis.svg" alt=""></figure>
    <figure><img src="logo-3-facet.svg" alt=""></figure>
    <figure><img src="logo-4-hexvault.svg" alt=""></figure>
    <figure><img src="logo-5-bloom.svg" alt=""></figure>
  </div>
</div>
</body>
</html>
